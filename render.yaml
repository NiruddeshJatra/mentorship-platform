# Render Blueprint for Intellectify Platform
# This file defines the infrastructure components for the application

# PostgreSQL Database
services:
  - type: web
    name: intellectify-backend
    env: node
    build:
      path: ./backend
      buildCommand: npm run build
      startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: intellectify-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
    plan: free
    region: oregon

  - type: web
    name: intellectify-frontend
    env: static
    build:
      path: ./frontend
      buildCommand: npm install && npm run build
      staticPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false  # Will be set to the backend service URL
    routes:
      - type: rewrite
        source: /(.*)
        destination: /index.html
    plan: free
    region: oregon

# Database
databases:
  - name: intellectify-db
    databaseName: intellectify
    user: intellectify_user
    plan: free
    region: oregon
